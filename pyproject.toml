[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaca-muerta-dca"
version = "0.1.0"
description = "Decline Curve Analysis tool for Vaca Muerta using public SESCO data."
authors = [
  { name="Tiago Meilan", email="meilantiago@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.2.0",
    "jupyter>=1.0.0",
    "pytest>=7.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort"
]

[tool.setuptools.packages.find]
where = ["src"]
